<!DOCTYPE html><html lang='id'><head><meta charset='UTF-8'><title>Quiz</title><link rel='stylesheet' href='styles.css'><script src='questions.js'></script></head><body><div class='top'><h2>Ujian Formatif</h2><h2 id='timer'>30:00</h2></div><div id='qz'></div><button onclick='submitQuiz()'>Submit</button><script type='module'>import{db,collection,addDoc}from'./firebase.js';const m=JSON.parse(sessionStorage.getItem('mhs')||'{}');let sec=1800;setInterval(()=>{sec--;timer.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(sec<=0)submitQuiz();},1000);const box=document.getElementById('qz');QUESTIONS.forEach((s,i)=>{let h=`<div class=card><b>${i+1}. ${s.q}</b>`;s.o.forEach((o,j)=>h+=`<label class=opt><input type=radio name=q${i} value=${j}> ${o}</label>`);box.innerHTML+=h+'</div>';});window.submitQuiz=async()=>{let score=0;const ans=[];QUESTIONS.forEach((s,i)=>{const p=document.querySelector(`input[name=q${i}]:checked`);const v=p?Number(p.value):-1;if(v===s.a)score++;ans.push(v);});await addDoc(collection(db,'results'),{...m,score,answers:ans,time:new Date().toISOString()});alert(`Nilai: ${score}/${QUESTIONS.length}`);location='index.html';};</script></body></html>
