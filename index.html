<!DOCTYPE html><html lang='id'><head><meta charset='UTF-8'><title>Login Quiz</title><link rel='stylesheet' href='styles.css'></head><body><div class='card'><h1>Quiz Formatif</h1><input id='nim' placeholder='NIM'><input id='nama' placeholder='Nama'><input id='kelas' placeholder='Kelas'><button onclick='mulai()'>Mulai Ujian</button></div><script>function mulai(){const d={nim:nim.value,nama:nama.value,kelas:kelas.value};if(!d.nim||!d.nama)return alert('Lengkapi identitas');sessionStorage.setItem('mhs',JSON.stringify(d));location='quiz.html';}</script></body></html>
