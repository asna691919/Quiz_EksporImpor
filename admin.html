<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Admin</title><link rel='stylesheet' href='styles.css'></head><body><div class='card'><h1>Dashboard Nilai</h1><button id='exp'>Export CSV</button><table><thead><tr><th>NIM</th><th>Nama</th><th>Kelas</th><th>Skor</th></tr></thead><tbody id='tb'></tbody></table></div><script type='module'>import{db,collection,getDocs}from'./firebase.js';const snap=await getDocs(collection(db,'results'));const data=[];snap.forEach(d=>{const x=d.data();data.push(x);tb.innerHTML+=`<tr><td>${x.nim}</td><td>${x.nama}</td><td>${x.kelas}</td><td>${x.score}</td></tr>`});exp.onclick=()=>{let csv='NIM,Nama,Kelas,Skor\n';data.forEach(r=>csv+=`${r.nim},${r.nama},${r.kelas},${r.score}\n`);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='nilai.csv';a.click();};</script></body></html>
